version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: subtitle_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subtitle_platform_prod}
      POSTGRES_USER: ${POSTGRES_USER:-subtitle_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subtitle_admin} -d ${POSTGRES_DB:-subtitle_platform_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: subtitle_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: subtitle_prod_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_secure_secret_key}
    volumes:
      - minio_prod_data:/data
    ports:
      - "9001:9001"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: subtitle_prod_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-subtitle_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-subtitle_platform_prod}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT Secret Key required}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minio_secure_secret_key}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-subtitles-private}
      - S3_REGION=us-east-1
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-4}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - backend_uploads:/app/uploads
      - backend_outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: subtitle_prod_frontend
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: subtitle_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  backend_uploads:
  backend_outputs:
