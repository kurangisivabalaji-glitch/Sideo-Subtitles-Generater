version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: subtitle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subtitle_platform
      POSTGRES_USER: subtitle_user
      POSTGRES_PASSWORD: subtitle_password_secure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtitle_user -d subtitle_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subtitle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: subtitle_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://subtitle_user:subtitle_password_secure@postgres:5432/subtitle_platform
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=local-dev-jwt-super-secret-key-replace-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MAX_CONCURRENT_JOBS=3
      - STORAGE_BACKEND=local
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: subtitle_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
